name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline-checks:
    name: baseline-checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install control-plane dependencies
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            pnpm install --no-frozen-lockfile
          fi

      - name: Install bot dependencies
        run: python3 -m pip install -r requirements.txt

      - name: Run repository baseline
        run: pnpm run check:repo

      - name: Run bot syntax check
        run: pnpm run check:python

      - name: Run test suite
        run: pnpm run check:tests

      - name: Lint production deploy script
        run: shellcheck scripts/deploy-production.sh

      - name: Setup QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Validate production container contract
        shell: bash
        run: |
          set -euo pipefail
          trap 'rm -f .env' EXIT
          printf 'BOT_TOKEN=ci-placeholder\n' > .env

          export HA_BOT_IMAGE='ghcr.io/example/ha-bot@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa'
          export HA_BOT_UID=10001
          export HA_BOT_GID=10001
          docker compose --project-name ha-bot --file compose.production.yml config --format json > /tmp/ha-bot-compose.json

          python3 - <<'PY'
          import json

          with open("/tmp/ha-bot-compose.json", encoding="utf-8") as stream:
              config = json.load(stream)

          service = config["services"]["bot"]
          assert "ports" not in service
          assert "container_name" not in service
          assert "expose" not in service
          assert "network_mode" not in service
          assert service["read_only"] is True
          assert service["user"] == "10001:10001"
          assert service["platform"] == "linux/arm64"
          assert service["pull_policy"] == "never"
          assert service["networks"] == {"default": None}
          assert service["cap_drop"] == ["ALL"]
          assert service["security_opt"] == ["no-new-privileges:true"]
          assert service["pids_limit"] == 128
          assert service["cpus"] == 0.5
          assert service["mem_limit"] == "402653184"
          assert service["logging"]["options"] == {"max-file": "3", "max-size": "10m"}
          assert service["volumes"][0]["type"] == "bind"
          assert service["volumes"][0]["target"] == "/data"
          assert service["volumes"][0].get("bind", {}).get("create_host_path") in (None, False)
          assert set(config["services"]) == {"bot"}
          assert set(config["networks"]) == {"default"}
          assert config["networks"]["default"]["name"] == "ha-bot_default"
          assert config["networks"]["default"].get("external", False) is False
          PY

          docker buildx build --check .
          docker buildx build \
            --platform linux/arm64 \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --load \
            --tag "ha-bot-ci:${GITHUB_SHA}" \
            .

          test "$(docker image inspect --format '{{.Architecture}}' "ha-bot-ci:${GITHUB_SHA}")" = arm64
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "ha-bot-ci:${GITHUB_SHA}")" = "$GITHUB_SHA"
          docker run --rm \
            --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=64m \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --user 10001:10001 \
            --env BOT_TOKEN=ci-placeholder \
            --entrypoint python \
            "ha-bot-ci:${GITHUB_SHA}" \
            -c 'import bot'
