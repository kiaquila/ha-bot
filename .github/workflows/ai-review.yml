name: AI Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number; dispatch ref must match its current head
        required: true
      trigger_mode:
        description: Must be skip; a trusted human requests native review separately
        required: false
        default: skip
      reviewed_gate_sha:
        description: Explicit read-only validation of reviewed gate code at this exact PR head
        required: false

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: ai-review-${{ github.event.pull_request.number || inputs.pr_number || github.ref }}
  cancel-in-progress: true

jobs:
  ai-review:
    name: AI Review
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout PR content
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Checkout trusted gate scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .gate-trusted

      - name: Select gate scripts
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          test -f .gate-trusted/scripts/resolve-pr-context.mjs
          test -f .gate-trusted/scripts/ai-review-gate.mjs
          echo "script_dir=.gate-trusted/scripts" >> "$GITHUB_OUTPUT"

      - name: Resolve PR context
        id: pr
        run: node "${{ steps.gate.outputs.script_dir }}/resolve-pr-context.mjs"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AI_REVIEW_PR_NUMBER: ${{ inputs.pr_number }}

      - name: Resolve selected review policy
        id: policy
        shell: bash
        env:
          SELECTED_AGENT: ${{ vars.AI_REVIEW_AGENT }}
          REQUESTED_TRIGGER_MODE: ${{ inputs.trigger_mode }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          selected="${SELECTED_AGENT:-codex}"
          selected="${selected:-codex}"
          case "$selected" in
            codex|claude|gemini) ;;
            *)
              echo "::error::Unsupported AI_REVIEW_AGENT value: '$selected'. Allowed: codex, claude, gemini."
              exit 1
              ;;
          esac
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            trigger_mode="${REQUESTED_TRIGGER_MODE:-skip}"
          else
            trigger_mode="skip"
          fi
          case "$trigger_mode" in
            skip) ;;
            *)
              echo "::error::Unsupported AI_REVIEW_TRIGGER_MODE value: '$trigger_mode'. Allowed: skip."
              exit 1
              ;;
          esac
          echo "selected_agent=$selected" >> "$GITHUB_OUTPUT"
          echo "trigger_mode=$trigger_mode" >> "$GITHUB_OUTPUT"

      - name: Select reviewed gate runtime
        id: runtime
        shell: bash
        env:
          REVIEWED_GATE_SHA: ${{ inputs.reviewed_gate_sha }}
          CURRENT_HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          EVENT_NAME: ${{ github.event_name }}
          SELECTED_AGENT: ${{ steps.policy.outputs.selected_agent }}
        run: |
          set -euo pipefail
          script_dir=".gate-trusted/scripts"
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            test "${GITHUB_SHA}" = "${CURRENT_HEAD_SHA}"
          fi
          if [ -n "${REVIEWED_GATE_SHA}" ]; then
            test "${EVENT_NAME}" = "workflow_dispatch"
            test "${SELECTED_AGENT}" = "codex"
            [[ "${REVIEWED_GATE_SHA}" =~ ^[a-f0-9]{40}$ ]]
            test "${REVIEWED_GATE_SHA}" = "${GITHUB_SHA}"
            test "${REVIEWED_GATE_SHA}" = "${CURRENT_HEAD_SHA}"
            test "${REVIEWED_GATE_SHA}" = "$(git rev-parse HEAD)"
            git diff --quiet HEAD -- scripts .unicorn-hub/config.json
            script_dir="scripts"
          fi
          echo "script_dir=$script_dir" >> "$GITHUB_OUTPUT"

      - name: Route and validate selected native review
        run: node "${{ steps.runtime.outputs.script_dir }}/ai-review-gate.mjs"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AI_REVIEW_AGENT: ${{ steps.policy.outputs.selected_agent }}
          AI_REVIEW_PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          AI_REVIEW_HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          AI_REVIEW_TRIGGER_MODE: skip
          AI_REVIEW_POLICY_ROOT: .gate-trusted
          AI_REVIEW_WAIT_MS: "30000"
          AI_REVIEW_POLL_MS: "5000"
          AI_REVIEW_MAX_POLL_MS: "10000"
          AI_REVIEW_DEBOUNCE_MS: "5000"
