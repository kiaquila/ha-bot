name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy-preflight:
    name: deploy-preflight
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install control-plane dependencies
        run: pnpm install --frozen-lockfile

      - name: Install bot dependencies
        run: python3 -m pip install -r requirements.txt

      - name: Run local guardrails
        run: pnpm run preflight

  build-image:
    name: build-image
    if: github.ref == 'refs/heads/main'
    needs: deploy-preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve image name
        id: image
        shell: bash
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Setup QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push immutable ARM64 image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.image.outputs.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

  production:
    name: production
    if: github.ref == 'refs/heads/main'
    needs: build-image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    environment:
      name: production
    steps:
      - name: Validate SSH deployment configuration
        shell: bash
        env:
          BOTS_SSH_HOST: ${{ secrets.BOTS_SSH_HOST }}
          BOTS_SSH_USER: ${{ secrets.BOTS_SSH_USER }}
          BOTS_SSH_PRIVATE_KEY: ${{ secrets.BOTS_SSH_PRIVATE_KEY }}
          BOTS_SSH_KNOWN_HOSTS: ${{ secrets.BOTS_SSH_KNOWN_HOSTS }}
          BOTS_SSH_PORT: ${{ secrets.BOTS_SSH_PORT }}
          BOTS_DEPLOY_PATH: ${{ secrets.BOTS_DEPLOY_PATH }}
          BOTS_SYSTEMD_SERVICE: ${{ secrets.BOTS_SYSTEMD_SERVICE }}
        run: |
          set -euo pipefail

          missing=()
          require_secret() {
            local name="$1"
            local value="$2"
            if [ -z "$value" ]; then
              missing+=("$name")
            fi
          }

          require_secret "BOTS_SSH_HOST" "$BOTS_SSH_HOST"
          require_secret "BOTS_SSH_USER" "$BOTS_SSH_USER"
          require_secret "BOTS_SSH_PRIVATE_KEY" "$BOTS_SSH_PRIVATE_KEY"
          require_secret "BOTS_SSH_KNOWN_HOSTS" "$BOTS_SSH_KNOWN_HOSTS"
          require_secret "BOTS_DEPLOY_PATH" "$BOTS_DEPLOY_PATH"
          require_secret "BOTS_SYSTEMD_SERVICE" "$BOTS_SYSTEMD_SERVICE"

          if [ "${#missing[@]}" -gt 0 ]; then
            printf "::error::Missing required GitHub secret(s): %s\n" "${missing[*]}"
            exit 1
          fi

          port="${BOTS_SSH_PORT:-22}"
          if [[ ! "$port" =~ ^[0-9]+$ ]]; then
            echo "::error::BOTS_SSH_PORT must be numeric when set."
            exit 1
          fi

      - name: Configure SSH
        shell: bash
        env:
          BOTS_SSH_HOST: ${{ secrets.BOTS_SSH_HOST }}
          BOTS_SSH_USER: ${{ secrets.BOTS_SSH_USER }}
          BOTS_SSH_PRIVATE_KEY: ${{ secrets.BOTS_SSH_PRIVATE_KEY }}
          BOTS_SSH_KNOWN_HOSTS: ${{ secrets.BOTS_SSH_KNOWN_HOSTS }}
          BOTS_SSH_PORT: ${{ secrets.BOTS_SSH_PORT }}
        run: |
          set -euo pipefail

          port="${BOTS_SSH_PORT:-22}"
          install -m 700 -d ~/.ssh
          printf "%s\n" "$BOTS_SSH_PRIVATE_KEY" > ~/.ssh/bots_deploy_key
          printf "%s\n" "$BOTS_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/bots_deploy_key ~/.ssh/known_hosts

          cat > ~/.ssh/config <<EOF
          Host bots
            HostName ${BOTS_SSH_HOST}
            User ${BOTS_SSH_USER}
            Port ${port}
            IdentityFile ~/.ssh/bots_deploy_key
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
          EOF
          chmod 600 ~/.ssh/config

      - name: Check SSH connectivity
        run: ssh bots true

      - name: Deploy immutable image to bots
        shell: bash
        env:
          DEPLOY_SHA: ${{ github.sha }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_FETCH_TOKEN: ${{ github.token }}
          GITHUB_REGISTRY_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          IMAGE_NAME: ${{ needs.build-image.outputs.image }}
          IMAGE_DIGEST: ${{ needs.build-image.outputs.digest }}
          BOTS_DEPLOY_PATH: ${{ secrets.BOTS_DEPLOY_PATH }}
          BOTS_SYSTEMD_SERVICE: ${{ secrets.BOTS_SYSTEMD_SERVICE }}
        run: |
          set -euo pipefail

          quote() {
            printf "%q" "$1"
          }

          if [[ ! "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Build did not return an immutable image digest."
            exit 1
          fi

          github_fetch_auth="$(printf "x-access-token:%s" "$GITHUB_FETCH_TOKEN" | base64 | tr -d "\n")"
          if [ -z "$github_fetch_auth" ]; then
            echo "::error::GitHub fetch credentials could not be prepared."
            exit 1
          fi

          remote_env=(
            "DEPLOY_SHA=$(quote "$DEPLOY_SHA")"
            "GITHUB_ACTOR=$(quote "$GITHUB_ACTOR")"
            "GITHUB_FETCH_URL=$(quote "https://github.com/${GITHUB_REPOSITORY}.git")"
            "GITHUB_FETCH_AUTH_HEADER=$(quote "AUTHORIZATION: Basic $github_fetch_auth")"
            "GITHUB_REGISTRY_TOKEN=$(quote "$GITHUB_REGISTRY_TOKEN")"
            "DEPLOY_PATH=$(quote "$BOTS_DEPLOY_PATH")"
            "HA_BOT_IMAGE=$(quote "${IMAGE_NAME}@${IMAGE_DIGEST}")"
            "HA_BOT_IMAGE_SOURCE=$(quote "https://github.com/${GITHUB_REPOSITORY}")"
            "LEGACY_SERVICE=$(quote "$BOTS_SYSTEMD_SERVICE")"
          )

          {
            printf "%s\n" "${remote_env[@]}"
            cat <<'REMOTE'
          set -euo pipefail

          cd "$DEPLOY_PATH"
          git reset --hard
          GIT_CONFIG_COUNT=1 \
            GIT_CONFIG_KEY_0=http.extraHeader \
          GIT_CONFIG_VALUE_0="$GITHUB_FETCH_AUTH_HEADER" \
            git fetch --prune "$GITHUB_FETCH_URL" main
          unset GITHUB_FETCH_AUTH_HEADER
          git checkout -B main "$DEPLOY_SHA"
          git reset --hard "$DEPLOY_SHA"

          current_sha="$(git rev-parse HEAD)"
          if [ "$current_sha" != "$DEPLOY_SHA" ]; then
            echo "Remote checkout ended at $current_sha instead of $DEPLOY_SHA." >&2
            exit 1
          fi

          umask 077
          docker_config="$(mktemp -d)"
          cleanup_registry_auth() {
            trap - EXIT HUP INT TERM
            docker --config "$docker_config" logout ghcr.io >/dev/null 2>&1 || true
            rm -rf "$docker_config"
          }
          trap cleanup_registry_auth EXIT
          trap 'exit 129' HUP
          trap 'exit 130' INT
          trap 'exit 143' TERM

          printf "%s" "$GITHUB_REGISTRY_TOKEN" |
            docker --config "$docker_config" login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker --config "$docker_config" pull "$HA_BOT_IMAGE"
          unset GITHUB_REGISTRY_TOKEN

          export HA_BOT_UID="$(id -u)"
          export HA_BOT_GID="$(id -g)"
          export DEPLOY_SHA HA_BOT_IMAGE HA_BOT_IMAGE_SOURCE LEGACY_SERVICE
          bash scripts/deploy-production.sh
          REMOTE
          } | ssh bots bash -se
